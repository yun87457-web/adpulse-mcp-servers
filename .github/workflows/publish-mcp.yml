name: Publish to Official MCP Registry

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install mcp-publisher
        run: |
          curl -fsSL "https://github.com/modelcontextprotocol/registry/releases/download/v1.8.12/mcp-publisher_linux_amd64.tar.gz" | tar -xz mcp-publisher
          chmod +x mcp-publisher
          sudo mv mcp-publisher /usr/local/bin/mcp-publisher

      - name: Login via GitHub OIDC
        run: mcp-publisher login github-oidc

      - name: Publish Google Ads Transparency MCP
        continue-on-error: true
        run: mcp-publisher publish google-ads-transparency/server.json

      - name: Publish Tech Stack & Ad Pixel Detector MCP
        continue-on-error: true
        run: mcp-publisher publish tech-stack-ad-pixels/server.json

      - name: Publish Unified 6-ATS Jobs & Hiring Intelligence MCP
        continue-on-error: true
        run: mcp-publisher publish ats-jobs-hiring-intel/server.json

      - name: Publish Website Contacts, Pricing & LLM Brief MCP
        continue-on-error: true
        run: mcp-publisher publish website-contacts-pricing-intel/server.json
