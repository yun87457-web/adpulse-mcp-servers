name: Publish to Official MCP Registry

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install mcp-publisher
        run: |
          curl -fsSL "https://github.com/modelcontextprotocol/registry/releases/download/v1.8.12/mcp-publisher_linux_amd64.tar.gz" | tar -xz mcp-publisher
          chmod +x mcp-publisher
          sudo mv mcp-publisher /usr/local/bin/mcp-publisher

      - name: Login via GitHub OIDC
        run: mcp-publisher login github-oidc

      - name: Publish all 5 MCP server manifests (idempotent on already-published versions)
        run: |
          set -euo pipefail
          publish_if_new() {
            local manifest="$1"
            echo "==> Publishing ${manifest}"
            set +e
            out=$(mcp-publisher publish "${manifest}" 2>&1)
            rc=$?
            set -e
            echo "${out}"
            if [ "${rc}" -eq 0 ]; then
              echo "Published ${manifest}"
              return 0
            fi
            if echo "${out}" | grep -qiE "already exists|duplicate version"; then
              echo "Skipping ${manifest}: version already published in Official MCP Registry."
              return 0
            fi
            echo "ERROR: publish failed for ${manifest} (exit ${rc})"
            return "${rc}"
          }

          publish_if_new "google-ads-transparency/server.json"
          publish_if_new "tech-stack-ad-pixels/server.json"
          publish_if_new "ats-jobs-hiring-intel/server.json"
          publish_if_new "website-contacts-pricing-intel/server.json"
          publish_if_new "sec-edgar-funding-insider/server.json"
